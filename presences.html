<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raviart Promotion - Présence du jour</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --noir:#0B0B0B; --noir2:#1A0A0A; --rouge:#D90429; --rouge-dark:#8B0000; --rouge-neon:#FF0033; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Oswald','Segoe UI',Arial,sans-serif;
    background:
      linear-gradient(180deg, rgba(0,0,0,0.35), rgba(0,0,0,0.65)),
      url('ring-bg.jpg') center/cover no-repeat fixed;
    min-height:100vh;
    color:#111;
  }
  .topbar{
    position:sticky;top:0;z-index:20;
    background:var(--noir);
    color:#fff;
    display:flex;align-items:center;gap:16px;
    padding:10px 18px;
    border-bottom:3px solid var(--rouge);
    box-shadow:0 4px 20px rgba(217,4,41,.4);
  }
  .burger,.nav-btn{
    width:36px;height:36px;
    border:1px solid var(--rouge);border-radius:6px;
    background:#1a0a0a;color:#fff;
    cursor:pointer;font-size:20px;
    display:grid;place-items:center;
    text-decoration:none;
  }
  .topbar h1{font-family:'Anton',sans-serif;font-size:18px;letter-spacing:1px;text-transform:uppercase}
  .topbar h1 span{color:var(--rouge)}
  .topbar small{opacity:.7;margin-left:auto;font-size:12px}
  .layout{display:flex}
  .sidebar{
    width:240px;min-height:calc(100vh - 53px);
    background:var(--noir);color:#fff;
    border-right:2px solid var(--rouge);
    padding:14px 10px;
    transition:transform .25s;
  }
  .sidebar a{
    display:flex;align-items:center;gap:10px;
    padding:10px 12px;border-radius:8px;
    color:#fff;text-decoration:none;font-size:14px;
    margin-bottom:6px;
  }
  .sidebar a.active, .sidebar a:hover{background:var(--rouge);color:#fff;box-shadow:0 0 10px rgba(217,4,41,.5)}
  .main{flex:1;padding:18px;display:flex;flex-direction:column;gap:18px}
  @media(max-width:1100px){ .sidebar{position:fixed;left:0;top:53px;bottom:0;transform:translateX(-100%);z-index:15} .sidebar.open{transform:translateX(0)} }
  .sidebar.collapsed{transform:translateX(-100%);position:fixed;left:0;top:53px;bottom:0;z-index:15}
  .sidebar.open{transform:translateX(0) !important}
  /* Facebook + calendrier - fond transparent, pas de blanc autour */
  .fb-row{
    display:grid;grid-template-columns:1fr 1fr;gap:18px;
    background:transparent;border:none;padding:0;
  }
  @media(max-width:900px){ .fb-row{grid-template-columns:1fr} }
  .fb-card{border:1px solid #ddd;background:#fff;display:flex;flex-direction:column;overflow:hidden}
  .fb-card-header{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid #eee}
  .fb-card-header img{width:40px;height:40px;border:1px solid #ddd}
  .fb-card-header strong{font-size:14px;display:block}
  .fb-card-header span{font-size:12px;opacity:.7}
  .fb-card-actions{display:flex;justify-content:space-between;padding:8px 10px;border-bottom:1px solid #eee;background:#fafafa}
  .fb-embed{display:flex;justify-content:center;align-items:start;background:#f5f5f5;padding:12px;flex:1}
  .fb-embed iframe{display:block;margin:0 auto;max-width:100%;border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
  .fb-card-actions button{font-size:12px;padding:4px 10px;border:1px solid #bbb;background:#e9e9e9;border-radius:4px;cursor:pointer}
  .calendrier{
    background:#fff;border:2px solid var(--noir2);border-radius:6px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.5);position:relative;overflow:hidden;
  }
  .calendrier::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--rouge),var(--rouge-neon),var(--rouge))}
  .calendrier h2{font-family:'Anton',sans-serif;font-size:22px;margin-bottom:6px;letter-spacing:1px;text-transform:uppercase;color:var(--noir2)}
  /* wins bas : pleine largeur comme demandé */
  .bottom-grid{display:grid;grid-template-columns:1fr;gap:18px}
  .win{background:#fff;border:2px solid var(--noir2);border-radius:6px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.5);position:relative}
  .win::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--rouge),var(--rouge-neon),var(--rouge))}
  .win-bar{background:linear-gradient(90deg,#0f0f0f 0%,#1d0a0a 100%);color:#e8c9c9;padding:7px 12px;display:flex;align-items:center;gap:8px;font-size:11px;border-bottom:2px solid var(--rouge);letter-spacing:.5px;text-transform:uppercase}
  .win-bar .dot{width:10px;height:10px;border-radius:50%;background:var(--rouge);box-shadow:0 0 8px var(--rouge)}
  .win-bar .title{flex:1;font-weight:600;letter-spacing:.3px}
  .win-bar .ctrls{opacity:.7}
  .win-body{padding:18px 18px 14px}
  .win-body h3{font-size:14px;margin:0 0 10px}
  label{font-size:13px}
  select, input[type=date]{border:1px solid #aaa;border-radius:4px;padding:5px 7px;font-size:13px}
  button{border:1px solid #999;background:#efefef;border-radius:4px;padding:5px 10px;font-size:13px;cursor:pointer}
  .presence-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .presence-btns button{flex:1;min-width:90px;padding:11px 8px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.2)}
  .btn-present{background:linear-gradient(180deg,#0e9f6e,#057a55);color:#fff;border-color:#04684a}
  .btn-retard{background:linear-gradient(180deg,#d6930a,#b45309);color:#fff;border-color:#92400e}
  .btn-blessure{background:linear-gradient(180deg,#7c6ec7,#5d4db3);color:#fff;border-color:#4c3fa0}
  .btn-exclu{background:linear-gradient(180deg,#D90429,#8B0000);color:#fff;border-color:#5c0000}
  .btn-absent{background:#f3f4f6;color:#333;border-color:#bbb}
  table{width:100%;border-collapse:collapse;margin-top:10px}
  th,td{border:1px solid #aaa;padding:6px 8px;text-align:left;font-size:13px}
  th{background:#f3f3f3}
  .suggestions{position:absolute;top:100%;left:0;width:100%;background:#fff;border:1px solid #aaa;border-radius:4px;max-height:140px;overflow-y:auto;z-index:15;box-shadow:0 4px 12px rgba(0,0,0,.2);display:none}
  .suggestion-item{padding:6px 8px;font-size:13px;cursor:pointer}
  .suggestion-item:hover{background:var(--rouge);color:#fff}
</style>
</head>
<body>

<div class="topbar">
  <a href="dashboard.html" class="nav-btn" title="Aller au Dashboard">⚙️</a>
  <h1>Raviart Promotion <span>— Dashboard</span></h1>
  <small id="todayLabel"></small>
</div>

<div class="layout">
  <main class="main">

    <!-- 2 COLONNES FACEBOOK : Gauche Raviart / Droite Tournai (Boxe Française) -->
    <div class="fb-row">
      <div style="display:flex;flex-direction:column;gap:0">
        <div style="background:var(--noir);color:#fff;padding:8px 12px;border-bottom:3px solid var(--rouge);font-family:'Anton',sans-serif;text-transform:uppercase;letter-spacing:1px;font-size:13px">⬅ Gauche — Raviart Promotion</div>
        <div id="postsRaviart" style="display:flex;flex-direction:column;gap:18px;margin-top:18px"></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:0">
        <div style="background:var(--noir);color:#fff;padding:8px 12px;border-bottom:3px solid var(--rouge);font-family:'Anton',sans-serif;text-transform:uppercase;letter-spacing:1px;font-size:13px">Droite — Tournai Savate (Boxe Française) ➡</div>
        <div id="postsTournai" style="display:flex;flex-direction:column;gap:18px;margin-top:18px"></div>
      </div>
    </div>

    <div class="calendrier">
      <h2>Calendrier compétitions</h2>
      <div id="calendrierCompetitions" style="margin-top:10px"></div>
    </div>

    <!-- BAS : Présences + Pas en ordre (même que dashboard) -->
    <div class="bottom-grid">
      <section class="win" id="presences">
        <div class="win-bar"><span class="dot"></span><span class="title">Présences du jour</span><span class="ctrls">— □ ×</span></div>
        <div class="win-body">
          <h3>Enregistrer la présence</h3>
          <div class="field" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
            <label>Boxeur :</label>
            <div style="position:relative">
              <input type="text" id="boxeurInput" placeholder="Tapez un nom..." autocomplete="off" style="border:1px solid #aaa;border-radius:4px;padding:5px 7px;font-size:13px;width:180px">
              <input type="hidden" id="boxeurSelect">
              <div id="suggestionsBoxeur" class="suggestions"></div>
            </div>
            <label for="presenceDate" style="margin-left:8px">Date :</label>
            <input type="date" id="presenceDate">
          </div>
          <div class="presence-btns">
            <button data-statut="Present" class="btn-present">Présent</button>
            <button data-statut="Retard" class="btn-retard">Retard</button>
            <button data-statut="Blessure" class="btn-blessure">Blessure</button>
            <button data-statut="Exclusion" class="btn-exclu">Exclu</button>
            <button id="supprimerBtn" class="btn-absent">Absent ✕</button>
          </div>
          <div id="result" style="margin-top:12px;font-weight:700;font-size:13px;min-height:18px"></div>
        </div>
      </section>

      <section class="win">
        <div class="win-bar"><span class="dot"></span><span class="title">Boxeurs pas en ordre</span><span class="ctrls">— □ ×</span></div>
        <div class="win-body">
          <table id="notInOrderTable">
            <thead><tr><th>Boxeur</th><th>Licence</th><th>Cotisation</th></tr></thead>
            <tbody><tr><td colspan="3">Chargement...</td></tr></tbody>
          </table>
        </div>
      </section>
    </div>

  </main>
</div>

<script src="js/config.js"></script>
<script>
// UI helpers
document.getElementById('todayLabel').textContent = new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});

const SUPABASE_BOXEURS = `${SUPABASE_CONFIG.URL}/rest/v1/${SUPABASE_CONFIG.TABLES.BOXEURS}`;
const SUPABASE_PRESENCES = `${SUPABASE_CONFIG.URL}/rest/v1/${SUPABASE_CONFIG.TABLES.PRESENCES}`;
const SUPABASE_LIC = `${SUPABASE_CONFIG.URL}/rest/v1/${SUPABASE_CONFIG.TABLES.LICENCES}`;
const SUPABASE_CAL = `${SUPABASE_CONFIG.URL}/rest/v1/calendrier`;
const SUPABASE_POSTS = `${SUPABASE_CONFIG.URL}/rest/v1/posts`;

function getLicenceStatusMessage(regDateStr){
  if(!regDateStr) return "En cours";
  const d=new Date(regDateStr); d.setFullYear(d.getFullYear()+1);
  const exp=d.toISOString().split('T')[0];
  const today=new Date().toISOString().split('T')[0];
  if(regDateStr>today) return `Valide à partir du ${regDateStr}`;
  return exp>=today?"Valide":"Expirée";
}
function getCotisationStatusMessage(paymentDateStr, expireStr){
  if(!paymentDateStr) return "Non payé";
  const today=new Date().toISOString().split('T')[0];
  if(paymentDateStr>today) return `Payé à partir du ${paymentDateStr}`;
  return (expireStr>=today)?"Payé":"Non payé";
}

let boxeursCache=[];
function getBoxeurById(id){ return boxeursCache.find(b=>b.id===id); }
function filterBoxeurs(q){
  const nq=(q||"").trim().toLowerCase();
  if(!nq) return boxeursCache.slice(0,3);
  const scored=boxeursCache.map(b=>{
    const full=(b.LastName+" "+(b.FirstName||"")).toLowerCase();
    const last=(b.LastName||"").toLowerCase();
    const first=(b.FirstName||"").toLowerCase();
    let score=2;
    if(full.startsWith(nq) || last.startsWith(nq) || first.startsWith(nq)) score=0;
    else if(full.includes(nq)) score=1;
    else return null;
    return {b,score};
  }).filter(x=>x).sort((a,b)=> a.score-b.score || a.b.LastName.localeCompare(b.b.LastName));
  return scored.slice(0,3).map(x=>x.b);
}
function renderSuggestions(query, sugEl, inputEl, hiddenEl){
  const list=filterBoxeurs(query);
  sugEl.innerHTML="";
  if(list.length===0){ sugEl.style.display="none"; return; }
  list.forEach(b=>{
    const div=document.createElement("div");
    div.className="suggestion-item";
    div.textContent=`${b.LastName} ${b.FirstName||""}`.trim();
    div.addEventListener("mousedown", (e)=>{ e.preventDefault(); hiddenEl.value=b.id; inputEl.value=`${b.LastName} ${b.FirstName||""}`.trim(); sugEl.style.display="none"; });
    sugEl.appendChild(div);
  });
  sugEl.style.display="block";
}
async function loadBoxeursSelect(){
  const tryUrls = [
    `${SUPABASE_BOXEURS}?select=id,LastName,FirstName&%22d%C3%A9sactiv%C3%A9%22=is.false`,
    `${SUPABASE_BOXEURS}?select=id,LastName,FirstName`,
  ];
  for(const url of tryUrls){
    try{
      const res=await fetch(url,{headers:sbHeaders()});
      const data=await res.json();
      if(!Array.isArray(data)) continue;
      const filtered = data.filter(b => b["désactivé"] !== true && b["desactive"] !== true);
      boxeursCache=filtered;
      const inputEl=document.getElementById('boxeurInput'), hiddenEl=document.getElementById('boxeurSelect'), sugEl=document.getElementById('suggestionsBoxeur');
      inputEl.addEventListener("input", ()=>{ hiddenEl.value=""; renderSuggestions(inputEl.value, sugEl, inputEl, hiddenEl); });
      inputEl.addEventListener("focus", ()=> renderSuggestions(inputEl.value, sugEl, inputEl, hiddenEl));
      inputEl.addEventListener("blur", ()=> setTimeout(()=> sugEl.style.display="none",150));
      return;
    }catch(e){ continue; }
  }
  document.getElementById('result').innerText="Erreur chargement boxeurs";
}
async function enregistrerPresence(boxeurId, statut){
  try{
    const dateInput=document.getElementById('presenceDate').value;
    const today=dateInput || new Date().toISOString().split('T')[0];
    await fetch(`${SUPABASE_PRESENCES}?boxeur_id=eq.${boxeurId}&date_cours=eq.${today}`,{method:'DELETE',headers:sbHeaders()});
    const res=await fetch(SUPABASE_PRESENCES,{method:'POST',headers:sbHeaders({'Content-Type':'application/json'}),body:JSON.stringify({boxeur_id:boxeurId,date_cours:today,statut})});
    if(!res.ok) throw new Error('insert');
    document.getElementById('result').textContent=`✅ Présence enregistrée : ${statut}`;
  }catch(e){document.getElementById('result').textContent="❌ Erreur enregistrement";}
}
async function supprimerPresence(boxeurId){
  try{
    const dateInput=document.getElementById('presenceDate').value;
    const today=dateInput || new Date().toISOString().split('T')[0];
    await fetch(`${SUPABASE_PRESENCES}?boxeur_id=eq.${boxeurId}&date_cours=eq.${today}`,{method:'DELETE',headers:sbHeaders()});
    document.getElementById('result').textContent="✅ Présence annulée (Absent)";
  }catch(e){document.getElementById('result').textContent="❌ Erreur annulation";}
}
function createFbCard(p){
  const url=p.facebook_url;
  const isReel=url.includes("/reel/");
  const embedUrl=isReel?`https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(url)}&show_text=false&width=267&height=476`:`https://www.facebook.com/plugins/post.php?href=${encodeURIComponent(url)}&show_text=true&width=500`;
  const card=document.createElement('div');
  card.className='fb-card';
  card.innerHTML=`
    <div class="fb-card-header"><img src="https://via.placeholder.com/40?text=F" alt="FB"><div><strong>Facebook</strong><span>${p.created_at?new Date(p.created_at).toLocaleDateString('fr-FR'):''}</span></div></div>
    <div class="fb-embed" style="${isReel?'background:#000;min-height:476px':'min-height:500px'}">
      <iframe src="${embedUrl}" width="${isReel?267:500}" height="${isReel?476:600}" style="border:none;overflow:hidden" scrolling="no" frameborder="0" allowfullscreen="true" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"></iframe>
    </div>
    <div class="fb-card-actions"><a href="${url}" target="_blank" style="text-decoration:none"><button>↗ Voir sur Facebook</button></a></div>`;
  return card;
}
async function loadPostsDynamic(){
  const colR=document.getElementById('postsRaviart'), colT=document.getElementById('postsTournai');
  if(!colR || !colT) return;
  colR.innerHTML='<p style="padding:12px;background:#fff;border:1px solid #ddd">Chargement...</p>';
  colT.innerHTML='<p style="padding:12px;background:#fff;border:1px solid #ddd">Chargement...</p>';
  let data=null;
  for(const sel of ["*","id,facebook_url,created_at"]){
    try{
      const res=await fetch(`${SUPABASE_POSTS}?select=${sel}&order=created_at.desc`,{headers:sbHeaders()});
      const j=await res.json();
      if(Array.isArray(j)){ data=j; break; }
      if(j && j.message && j.message.includes("club")) continue;
    }catch(e){ continue; }
  }
  try{
    colR.innerHTML=''; colT.innerHTML='';
    if(!Array.isArray(data) || data.length===0){
      colR.innerHTML='<div class="fb-card" style="padding:20px;text-align:center;background:#fff;border:1px solid #ddd">Aucun post Raviart</div>';
      colT.innerHTML='<div class="fb-card" style="padding:20px;text-align:center;background:#fff;border:1px solid #ddd">Aucun post Tournai</div>';
      return;
    }
    let hasR=false, hasT=false;
    data.forEach(p=>{
      const club=p.club || "Raviart";
      const card=createFbCard(p);
      if(club==="Tournai"){ colT.appendChild(card); hasT=true; }
      else { colR.appendChild(card); hasR=true; }
    });
    if(!hasR) colR.innerHTML='<div class="fb-card" style="padding:20px;text-align:center;background:#fff;border:1px solid #ddd">Aucun post Raviart</div>';
    if(!hasT) colT.innerHTML='<div class="fb-card" style="padding:20px;text-align:center;background:#fff;border:1px solid #ddd">Aucun post Tournai</div>';
  }catch(e){ colR.innerHTML='<p>Erreur</p>'; colT.innerHTML='<p>Erreur</p>'; }
}
async function loadCalendrierDynamic(){
  const container=document.getElementById('calendrierCompetitions');
  if(!container) return;
  container.innerHTML='Chargement...';
  try{
    const res=await fetch(`${SUPABASE_CAL}?select=*&order=date.asc,heure.asc`,{headers:sbHeaders()});
    const data=await res.json();
    if(!Array.isArray(data) || data.length===0){ container.innerHTML='<p style="font-size:14px;opacity:.7">Aucun évènement à venir</p>'; return; }
    let html='<table><thead><tr><th>Date</th><th>Heure</th><th>Lieu</th><th>Discipline</th></tr></thead><tbody>';
    data.forEach(ev=>{
      const badge=ev.discipline==='Boxe Anglaise'?'🔴':'🔵';
      const d=ev.date?new Date(ev.date).toLocaleDateString('fr-FR'):'';
      const h=(ev.heure||'').slice(0,5);
      html+=`<tr><td>${d}</td><td>${h}</td><td>${ev.lieu||''}</td><td>${badge} ${ev.discipline||''}</td></tr>`;
    });
    html+='</tbody></table>';
    container.innerHTML=html;
  }catch(e){ container.innerHTML='Erreur chargement calendrier'; }
}
async function loadBoxeursNotInOrder(){
  tbody.innerHTML='<tr><td colspan="3">Chargement...</td></tr>';
  try{
    const query=`select=id,LastName,FirstName,${SUPABASE_CONFIG.TABLES.LICENCES}!left(id,licencetype,licenceregdate,cotisationtype,cotisationpaymentdate)`;
    const res=await fetch(`${SUPABASE_BOXEURS}?${query}`,{headers:sbHeaders()});
    const boxeurs=await res.json();
    tbody.innerHTML='';
    boxeurs.forEach(b=>{
      const l=b.licencesetcotisations && b.licencesetcotisations[0]?b.licencesetcotisations[0]:null;
      let licS="En cours", cotS="Non payé";
      if(l){
        licS=getLicenceStatusMessage(l.licenceregdate);
        const type=parseInt(l.cotisationtype)||0;
        let exp='';
        if(type===3) exp=l.cotisationpaymentdate||new Date().toISOString().split('T')[0];
        else if(type>0 && l.cotisationpaymentdate){ const d=new Date(l.cotisationpaymentdate); d.setMonth(d.getMonth()+type); exp=d.toISOString().split('T')[0]; }
        cotS=getCotisationStatusMessage(l.cotisationpaymentdate,exp);
      }
      if(!(licS==="Valide" && cotS==="Payé")){
        const tr=document.createElement('tr');
        tr.innerHTML=`<td>${b.LastName} ${b.FirstName}</td><td>${licS}</td><td>${cotS}</td>`;
        tbody.appendChild(tr);
      }
    });
    if(!tbody.hasChildNodes()) tbody.innerHTML='<tr><td colspan="3">Tous les boxeurs sont en ordre 👍</td></tr>';
  }catch(e){tbody.innerHTML='<tr><td colspan="3">Erreur chargement</td></tr>';}
}

document.addEventListener('DOMContentLoaded', async ()=>{
  document.getElementById('presenceDate').value=new Date().toISOString().split('T')[0];
  await loadBoxeursSelect();
  loadBoxeursNotInOrder();
  loadPostsDynamic();
  loadCalendrierDynamic();
  document.querySelectorAll('button[data-statut]').forEach(btn=> btn.addEventListener('click',()=>{
    const sel=document.getElementById('boxeurSelect');
    if(!sel.value){alert('Veuillez choisir un boxeur');return;}
    enregistrerPresence(sel.value, btn.dataset.statut);
  }));
  document.getElementById('supprimerBtn').addEventListener('click',()=>{
    const sel=document.getElementById('boxeurSelect');
    if(!sel.value){alert('Veuillez choisir un boxeur');return;}
    supprimerPresence(sel.value);
  });
});
</script>
</body>
</html>
